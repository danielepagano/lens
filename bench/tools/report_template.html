<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens Benchmark Report</title>
<style>
:root {
  --bg: #1a1a2e; --surface: #16213e; --border: #0f3460;
  --text: #e0e0e0; --muted: #8899aa; --accent: #e94560;
  --green: #4ecca3; --yellow: #ffc107; --red: #e94560;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.6; }
h1, h2, h3 { font-weight: 600; }
h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
h2 { font-size: 1.2rem; margin: 2rem 0 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
h3 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--muted); }

.meta { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
.meta span { background: var(--surface); padding: 0.2rem 0.6rem; border-radius: 4px; border: 1px solid var(--border); }

.badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 700; font-size: 0.9rem; }
.badge-pass { background: var(--green); color: #111; }
.badge-fail { background: var(--red); color: #fff; }

.step { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
.step-cmd { font-family: var(--mono); font-size: 0.85rem; color: var(--accent); margin-bottom: 0.5rem; }
.step-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }

details { cursor: pointer; }
details summary { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
.output { font-family: var(--mono); font-size: 0.8rem; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem; max-height: 400px; overflow-y: auto; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; }
td.score { text-align: center; font-weight: 700; font-family: var(--mono); }
td.score-1, td.score-2 { color: var(--red); }
td.score-3 { color: var(--yellow); }
td.score-4, td.score-5 { color: var(--green); }

.iteration { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
.iteration-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.delta { font-family: var(--mono); font-weight: 700; }
.delta-pos { color: var(--green); }
.delta-neg { color: var(--red); }
.delta-zero { color: var(--muted); }
.kept { font-size: 0.8rem; padding: 0.1rem 0.4rem; border-radius: 3px; }
.kept-yes { background: var(--green); color: #111; }
.kept-no { background: var(--border); color: var(--muted); }

.prompt-diff { font-family: var(--mono); font-size: 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem; margin-top: 0.5rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

.compare-header { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.compare-label { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.8rem; font-size: 0.85rem; }

.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-top: 1rem; font-size: 0.9rem; }
.reasoning { font-size: 0.8rem; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div id="app"></div>

<script id="report-data" type="application/json">__REPORT_JSON__</script>

<script>
const data = JSON.parse(document.getElementById('report-data').textContent);
const app = document.getElementById('app');

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function scoreClass(n) { return 'score score-' + Math.max(1, Math.min(5, Math.round(n))); }

function deltaStr(d) {
  if (d > 0) return `<span class="delta delta-pos">+${d.toFixed(1)}</span>`;
  if (d < 0) return `<span class="delta delta-neg">${d.toFixed(1)}</span>`;
  return `<span class="delta delta-zero">0.0</span>`;
}

function renderSingle(r) {
  const m = r.meta || {};
  const ev = r.evaluation || {};
  const pass = ev.pass !== false;
  const avg = (ev.average_score || 0).toFixed(1);

  let html = `<h1>${esc(m.scenario_name || m.scenario_id || 'Benchmark')}</h1>`;
  html += `<div class="meta">
    <span>Profile: ${esc(m.llm_profile || '?')}</span>
    <span>Model: ${esc(m.llm_model || '?')}</span>
    <span>${esc((m.timestamp || '').slice(0, 16))}</span>
    <span class="badge ${pass ? 'badge-pass' : 'badge-fail'}">${avg} / 5</span>
  </div>`;

  // Steps
  if (r.steps && r.steps.length) {
    html += '<h2>Steps</h2>';
    for (const s of r.steps) {
      html += `<div class="step">
        <div class="step-cmd">$ lens ${(s.command || []).map(esc).join(' ')}</div>
        ${s.description ? `<div class="step-desc">${esc(s.description)}</div>` : ''}
        <details><summary>Output (${(s.output || '').length} chars)</summary>
          <div class="output">${esc(s.output || '')}</div>
        </details>
      </div>`;
    }
  }

  // Score table
  if (ev.scores && ev.scores.length) {
    const stepIds = [...new Set(ev.scores.map(s => s.step_id))];
    const criteria = [...new Set(ev.scores.map(s => s.criterion))];
    const lookup = {};
    for (const s of ev.scores) lookup[s.criterion + '|' + s.step_id] = s;

    html += '<h2>Scores</h2><table><thead><tr><th>Criterion</th>';
    for (const sid of stepIds) html += `<th style="text-align:center">${esc(sid)}</th>`;
    html += '<th style="text-align:center">Avg</th></tr></thead><tbody>';

    for (const c of criteria) {
      html += `<tr><td>${esc(c)}</td>`;
      let sum = 0, count = 0;
      for (const sid of stepIds) {
        const entry = lookup[c + '|' + sid];
        const sc = entry ? entry.score : '-';
        const cls = typeof sc === 'number' ? scoreClass(sc) : '';
        html += `<td class="${cls}" title="${esc(entry?.reasoning || '')}">${sc}</td>`;
        if (typeof sc === 'number') { sum += sc; count++; }
      }
      const a = count ? (sum / count).toFixed(1) : '-';
      html += `<td class="${typeof a === 'string' && a !== '-' ? scoreClass(parseFloat(a)) : ''}" style="text-align:center">${a}</td></tr>`;
    }
    html += '</tbody></table>';

    // Reasoning details
    html += '<details style="margin-top:0.75rem"><summary>Score reasoning</summary>';
    for (const s of ev.scores) {
      if (s.reasoning) {
        html += `<div style="margin:0.5rem 0"><strong>${esc(s.step_id)}</strong> / ${esc(s.criterion.slice(0, 50))}...<br><span class="reasoning">${esc(s.reasoning)}</span></div>`;
      }
    }
    html += '</details>';
  }

  if (ev.summary) {
    html += `<div class="summary">${esc(ev.summary)}</div>`;
  }

  // Iterations
  if (r.iterations && r.iterations.length) {
    html += '<h2>Prompt Iterations</h2>';
    for (const it of r.iterations) {
      const d = it.delta || 0;
      html += `<div class="iteration">
        <div class="iteration-header">
          <div><strong>Iteration ${it.iteration}</strong>: ${esc(it.prompt_key || '')}</div>
          <div>${deltaStr(d)} <span class="kept ${it.kept ? 'kept-yes' : 'kept-no'}">${it.kept ? 'kept' : 'reverted'}</span></div>
        </div>
        <div style="font-size:0.85rem">${esc(it.change_description || '')}</div>
        <div style="font-size:0.85rem;color:var(--muted)">Method: ${esc(it.method || '?')} | Samples: ${it.samples || 1} | Before: ${(it.scores_before?.average || 0).toFixed(1)} | After: ${(it.scores_after?.average || 0).toFixed(1)}</div>
        <details><summary>Prompt diff</summary>
          <div class="prompt-diff">BEFORE:\n${esc(it.prompt_before || '')}\n\nAFTER:\n${esc(it.prompt_after || '')}</div>
        </details>
      </div>`;
    }
  }

  return html;
}

function renderCompare(reports) {
  let html = '<h1>Benchmark Comparison</h1>';
  const labels = reports.map(r => r.meta?.llm_profile || r.meta?.scenario_id || '?');
  html += '<div class="compare-header">';
  for (const l of labels) html += `<span class="compare-label">${esc(l)}</span>`;
  html += '</div>';

  // Collect all criteria across reports
  const allCriteria = [...new Set(reports.flatMap(r => (r.evaluation?.scores || []).map(s => s.criterion)))];

  if (allCriteria.length) {
    html += '<table><thead><tr><th>Criterion</th>';
    for (const l of labels) html += `<th style="text-align:center">${esc(l)}</th>`;
    html += '<th style="text-align:center">\u0394</th></tr></thead><tbody>';

    for (const c of allCriteria) {
      html += `<tr><td>${esc(c)}</td>`;
      const avgs = reports.map(r => {
        const scores = (r.evaluation?.scores || []).filter(s => s.criterion === c);
        if (!scores.length) return null;
        return scores.reduce((a, s) => a + s.score, 0) / scores.length;
      });
      for (const a of avgs) {
        if (a === null) html += '<td style="text-align:center">-</td>';
        else html += `<td class="${scoreClass(a)}">${a.toFixed(1)}</td>`;
      }
      const nums = avgs.filter(a => a !== null);
      if (nums.length >= 2) {
        const d = nums[nums.length - 1] - nums[0];
        html += `<td style="text-align:center">${deltaStr(d)}</td>`;
      } else {
        html += '<td style="text-align:center">-</td>';
      }
      html += '</tr>';
    }

    // Average row
    html += '<tr style="font-weight:700"><td>Average</td>';
    const overalls = reports.map(r => r.evaluation?.average_score || 0);
    for (const o of overalls) html += `<td class="${scoreClass(o)}">${o.toFixed(1)}</td>`;
    if (overalls.length >= 2) {
      html += `<td style="text-align:center">${deltaStr(overalls[overalls.length - 1] - overalls[0])}</td>`;
    } else {
      html += '<td>-</td>';
    }
    html += '</tr></tbody></table>';
  }

  return html;
}

// Render
if (Array.isArray(data)) {
  app.innerHTML = renderCompare(data);
} else {
  app.innerHTML = renderSingle(data);
}
</script>
</body>
</html>
