# Deepseek Pro via OpenRouter — the stronger sibling of `deepseek.toml`.
# Use for quality-sensitive runs (GM voice, rules adjudication) where flash is
# too weak to tell a prompt problem from a model problem.
#
# Requires OPEN_ROUTER_API_KEY environment variable.
[llm]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPEN_ROUTER_API_KEY"
model = "deepseek/deepseek-v4-pro"
temperature = 0.9
timeout_seconds = 300
