# Deepseek Pro via OpenRouter — the stronger sibling of `deepseek.toml`.
# Use for quality-sensitive runs (GM voice, rules adjudication) where flash is
# too weak to tell a prompt problem from a model problem.
#
# The model id is PINNED to a dated snapshot on purpose:
#   * reproducibility — a floating alias silently re-points under a benchmark;
#   * price — the pinned snapshot is the discounted one. As of 2026-08-12
#     `deepseek/deepseek-v4-pro-0813` is $0.435/$0.870 per 1M in/out, while the
#     floating `deepseek/deepseek-v4-pro` alias is $1.168/$2.336 — 2.7x more for
#     the same family.
# Re-check pricing before a large run; snapshots and discounts both move.
#
# Requires OPEN_ROUTER_API_KEY environment variable.
[llm]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPEN_ROUTER_API_KEY"
model = "deepseek/deepseek-v4-pro-0813"
temperature = 0.9
timeout_seconds = 300
