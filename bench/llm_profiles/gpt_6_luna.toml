# GPT-6 Luna (OpenAI)
# The endpoint rejects temperature, so none is set. Pin the plain `openai` TAG:
# `openai/fast` is the same model at 2x the price, `openai/flex` is slower.
[llm]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPEN_ROUTER_API_KEY"
model = "openai/gpt-6-luna"
timeout_seconds = 300
first_token_timeout_seconds = 60

[llm.extra_payload]
provider = { order = ["openai"], allow_fallbacks = false }
