speech.grammar.xai.rules = '''

## Inline tags: ``[ ]``

- Use **one cue per pair of brackets**. Never combine cues with commas, spaces, conjunctions, or natural language inside a single ``[ … ]``. Wrong: ``[laugh, soft]``, ``[small self-deprecating laugh]``, ``[I exhale, steadying]``. Right: ``[soft-laugh]``.
- **Only** use ``[tag]`` for **closed, synthesizer-oriented** cues (pauses, breath, simple nonverbal sounds). If you are tempted to describe *how* the character feels or moves in brackets, **stop** — write it in prose outside the dialog quote.
- Never use ``[wink]``, ``[nods]``, ``[smiles]``, or similar **stage directions** inside dialogue; they are not speech tags and often produce garbage audio.

## Wrapping tags: ``<>``

- Use wrapping tags to set delivery for a **whole phrase**; place inline ``[tag]`` **inside** the wrapped span when you need both (e.g. ``<soft>[laugh] I guess so.</soft>``).
- Same rules as inline tags: no spaces or punctuation, just one word or two dash-separated words. 
- Close ALL wrapping tags!

## Example Forms

- Inline (one cue per bracket): pauses ``[pause]`` ``[long-pause]``; breath ``[breath]`` ``[inhale]`` ``[exhale]`` ``[sigh]``; simple sounds ``[laugh]`` ``[chuckle]`` ``[giggle]`` ``[cry]`` ``[tsk]`` ``[tongue-click]`` ``[lip-smack]``.
- Wrapping (complete phrases): volume/intensity ``<soft>`` ``<whisper>`` ``<loud>`` ``<build-intensity>`` ``<decrease-intensity>``; pitch/speed ``<higher-pitch>`` ``<lower-pitch>`` ``<slow>`` ``<fast>``; style ``<sing-song>`` ``<singing>`` ``<laugh-speak>`` ``<emphasis>``. Combined style tokens like ``<slow-whisper>`` are fine when they stay machine-like, not sentence-long.

## Other delivery rules

- Use natural punctuation; punctuation drives timing and intonation. Do **not** use dashes (``-`` or ``—``) in spoken lines: TTS glosses them without useful pause; use colons, semicolons, or parentheses instead.
- Prefer one clear structural choice (one wrap or one or two inline cues) over stacking many tags; when you need two dimensions (e.g. quiet + laugh), **nest**, do not comma-merge inside ``[ ]``.
- Use ``[pause]`` / ``[long-pause]`` to let a beat land before the next clause.
- Keep the line readable as dialogue first; tags are subtle stage directions, not the focus.

Example (format only; do not copy verbatim):

I lean in until our shoulders almost touch. They exhale, steadying themself.

> [Riley] Wait [breath] you're serious?

They don't answer at once. I can't read their face.

> [Riley] <soft>Fine.</soft> [long-pause] But if this goes wrong, that's on you.
'''

speech.grammar.gemini.rules = '''

## Audio tags (Gemini TTS transcript tags)

Tags are **inline square-bracket modifiers** in the transcript: ``[whispers]``, ``[laughs]``, ``[gasp]``, ``[sighs]``, ``[cough]``, and similar. They change tone, pace, emphasis, or add short nonverbal sounds. There is no fixed exhaustive list — experiment within reason, but stay machine-like (short slug words, not sentences).

- Place tags **inside spoken dialogue** only, typically at the start of a clause or section you want to steer.
- Tags are **not** stage directions in prose: do not put ``[nods]``, ``[smiles]``, or acting notes in brackets; write physical beats in plain narration outside the spoken line.

## Common tags (reference)

Delivery and emotion (often at line start): ``[excitedly]``, ``[bored]``, ``[reluctantly]``, ``[sarcastically]``, ``[amazed]``, ``[curious]``, ``[serious]``, ``[panicked]``, ``[mischievously]``, ``[tired]``.

Pace and volume: ``[whispers]``, ``[shouting]``, ``[very fast]``, ``[very slow]`` — you may combine modifiers in one bracket when the docs show it (e.g. ``[sarcastically, one painfully slow word at a time]``).

Interjections and sounds: ``[laughs]``, ``[giggles]``, ``[sighs]``, ``[gasp]``, ``[cough]``.

You can whisper one phrase and shout another in the same line:

``[whispers] Hey there, I'm a new model, [shouting] and I can say things in many different ways. [whispers] How can I help you today?``

## Style

- Keep tags **sparse** unless the moment needs strong steering — one or two tags per line is usually enough.
- The transcript should still read as natural dialogue; tags adjust delivery, they are not the main content.
- Punctuation still matters for timing and intonation.

Example:

``[excitedly] Yes, massive vibes in the studio! [shouting] Turn this up! We've got the roadmap landing in three, two... let's go!``
'''
