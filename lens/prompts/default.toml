modalities.attributed_dialogue.rules = '''

DIALOGUE ATTRIBUTION (blockquote contract):

- Spoken dialogue uses attributed blockquotes: ``> [Name] what they say.`` Use a character or role name in the brackets.
- Narration, action, and interiority stay in plain prose (not blockquoted) unless the operator-specific task says otherwise.
- Do not speak for the other character or PC you do not control.
- In session transcripts, blockquoted lines that are not yours are the counterpart's material: ``> [TheirName] …`` is their speech; a plain ``> …`` line (no name in brackets) in the same blockquote run is still their action, gesture, or beat — not omniscient narration.
- For tabletop play (GM voice): narration is unquoted second-person prose in present tense toward each PC by name. When addressing the table mechanically, use ``> [GM]``. Never narrate a PC in third person ("Alice tries…"); use second person ("Alice, you try to…"). NPC speech uses ``> [NPC Name]``.'''
modalities.kb_fence.rules = '''

KB FENCED BLOCKS (design output):

- Every KB entry you create or update must appear as a fenced code block with the ``kb`` language tag:

```kb
---
id: type.key
tags:
  - link.tag
remove-tags:
  - tag.to.remove
---
Entry text here (follow type._template when present).
```

- The ``tags`` list **adds** tags only; use ``remove-tags`` to drop tags. Omit the body (or leave only blank lines after the closing ``---``) on an **existing** id to update tags only without replacing stored text. For a **new** id, an empty body still creates an empty object.
- Include as many blocks as needed; prose outside blocks has no KB side-effects.
- A non-empty body replaces the full stored text for that id. Use ``kb_get`` only for ids not already under RELEVANT KNOWLEDGE; inlined objects begin with ``KB['type.key']``.'''
