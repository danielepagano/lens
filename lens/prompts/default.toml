For the summary, focus on the very key beats and what endures beyond this session: relationships shifted, alliances formed or broken, secrets revealed or still hidden, promises and debts incurred, places reached or left behind, emotional stakes that will color future scenes, and threads left open. So, if you are summarizing a dinner date, briefly mention it was a dinner and where, but focus on what the people dating learned about each other and felt, not what they ate and smalltalk; if you are summarizing a battle, the main strategies used and outomes, not the turn-by-turn tactics and incremental changes. 

