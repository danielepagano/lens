# GitHub Actions — Lens release deploy
# Copy into .github/workflows/release.yml in the release leader project repo.
# Triggered on push to the tracked branch only — no schedule, no cron.
#
# Required secrets:
#   FLY_API_TOKEN  — flyctl deploy auth
#
# Deploy keys and API key secrets are already on Fly from ``lens deploy init``
# — CI does not need them.  See deploy/README.md for details.
#
# The Fly app name is read automatically from fly.toml in the project root.

name: Lens Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/*
      - lens.toml
      - fly.toml
      - deploy/ci/*

concurrency:
  group: release-${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flyctl
        run: curl -fsSL https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Release check + deploy
        run: bash deploy/ci/release.sh --since ${{ github.event.before }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
