# GitHub Actions — Lens release deploy
# Copy into .github/workflows/release.yml in the release leader project repo.
# Triggered on push to the tracked branch only — no schedule, no cron.
#
# Required secrets / vars:
#   FLY_API_TOKEN  — flyctl deploy auth (secret)
#   FLY_APP        — Fly app name (variable)
#
# Any api_key_env from lens.toml and deploy key env vars the topology
# requires must also be set as secrets — run ``deploy/ci/release_secrets.py check``
# locally to see the full list for your project.

name: Lens Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ vars.FLY_APP || 'lens' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flyctl
        run: curl -fsSL https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Release check + deploy
        run: bash deploy/ci/release.sh --since ${{ github.event.before }} --fly-app ${{ vars.FLY_APP }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
